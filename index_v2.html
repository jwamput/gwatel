<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ndokk_Mu — Distributor Telur</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#111318;--ink2:#2D3142;--ink3:#6B7280;--ink4:#C4C9D4;
  --bg:#F4F6FA;--bg2:#ECEEF5;--bg3:#E0E3EF;
  --surface:#FFFFFF;
  --border:#DDE1EF;
  --or:#FF6B2C;--or-s:#FFF1EB;--or-d:#D94E12;--or-glow:rgba(255,107,44,0.25);
  --gr:#00B87A;--gr-s:#E6FBF4;
  --re:#EF4444;--re-s:#FEF2F2;
  --bl:#3B6FFF;--bl-s:#EEF3FF;
  --sh:0 1px 3px rgba(17,19,24,0.06),0 4px 16px rgba(17,19,24,0.06);
  --sh2:0 8px 32px rgba(17,19,24,0.12);
  --r:14px;--rf:999px;
  --nav-h:64px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:99px}

/* HEADER */
.hdr{
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:300;gap:12px;
}
.hdr-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-icon{
  width:38px;height:38px;
  background:linear-gradient(135deg,var(--or) 0%,var(--or-d) 100%);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;box-shadow:0 4px 12px var(--or-glow);
}
.hdr-title{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-0.5px;line-height:1.1}
.hdr-sub{font-size:9px;color:var(--ink3);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-top:1px}
.btn-login{
  background:linear-gradient(135deg,var(--or) 0%,var(--or-d) 100%);
  color:#fff;border:none;border-radius:var(--rf);
  padding:9px 20px;font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:700;font-size:.84rem;cursor:pointer;
  box-shadow:0 4px 14px var(--or-glow);transition:all .2s;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--or-glow)}

/* TICKER */
.ticker{
  background:var(--or);color:#fff;
  text-align:center;padding:8px 16px;
  font-weight:700;font-size:.85rem;letter-spacing:0.5px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,var(--ink) 0%,var(--ink2) 100%);
  color:#fff;padding:40px 20px 32px;text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{content:'🥚';font-size:140px;position:absolute;right:40px;top:0;opacity:.07;transform:rotate(-15deg);pointer-events:none}
.hero h1{font-size:1.9rem;font-weight:900;color:var(--or);margin-bottom:6px;letter-spacing:-0.5px}
.hero p{color:#9ca3af;font-size:.9rem;margin-bottom:28px}
.hero-stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hero-stat{
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:var(--r);padding:16px 28px;text-align:center;
  backdrop-filter:blur(4px);min-width:140px;
}
.hero-stat .val{font-size:1.5rem;font-weight:800;color:var(--or)}
.hero-stat .lbl{font-size:.72rem;color:#9ca3af;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}

/* WRAP */
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 40px}

/* SECTION HEADER */
.section-hd{
  font-weight:800;font-size:.95rem;color:var(--ink);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.section-hd::after{content:'';flex:1;height:2px;background:linear-gradient(to right,var(--or-glow),transparent);border-radius:2px}

/* KPI CARDS */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:28px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border)}
.kpi-card{padding:20px 18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.c-or::before{background:linear-gradient(90deg,var(--or),#FF9A5C)}
.kpi-card.c-gr::before{background:linear-gradient(90deg,var(--gr),#00d68f)}
.kpi-label{font-size:.68rem;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}
.kpi-val{font-size:1.5rem;font-weight:800;color:var(--ink);margin:4px 0;letter-spacing:-0.5px}
.kpi-sub{font-size:.72rem;color:var(--ink4);font-weight:500}
.kpi-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:2rem;opacity:.12}

/* SPINNER */
.spinner{width:20px;height:20px;border:2.5px solid var(--bg3);border-top-color:var(--or);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{text-align:center;padding:32px;color:var(--ink4);font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:8px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,19,24,0.6);backdrop-filter:blur(6px);z-index:400;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:28px 26px;width:100%;max-width:400px;box-shadow:var(--sh2);position:relative;animation:popIn .2s ease;border:1px solid var(--border)}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:14px;right:16px;background:var(--bg2);border:none;width:30px;height:30px;border-radius:50%;font-size:1rem;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--re-s);color:var(--re)}
.modal h3{font-weight:800;font-size:1.1rem;color:var(--ink);margin-bottom:4px}
.modal p{font-size:.82rem;color:var(--ink3);margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.74rem;font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.6px}
.form-group input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-s);background:var(--surface)}
.btn-primary{background:linear-gradient(135deg,var(--or) 0%,var(--or-d) 100%);color:#fff;border:none;border-radius:var(--rf);padding:12px 26px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px var(--or-glow);width:100%}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--or-glow)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{color:var(--re);font-size:.8rem;margin-top:8px;text-align:center;display:none}

/* STOK KAT */
.kat-stat{
  background:rgba(255,255,255,0.09);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:var(--r);padding:12px 18px;text-align:center;
  backdrop-filter:blur(4px);min-width:120px;
}
.kat-stat .val{font-size:1.1rem;font-weight:800;color:#fff}
.kat-stat .lbl{font-size:.67rem;color:#9ca3af;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;word-break:break-word}

/* FOOTER */
footer{text-align:center;padding:20px;color:var(--ink4);font-size:.78rem;border-top:1px solid var(--border)}

/* RESPONSIVE */
@media(max-width:640px){
  .grid-2{grid-template-columns:1fr 1fr}
  .hero h1{font-size:1.4rem}
  .hero-stats{gap:10px}
  .hero-stat{padding:12px 16px;min-width:110px}
  .hero-stat .val{font-size:1.2rem}
  .agen-grid{grid-template-columns:1fr}
}
@media(max-width:400px){
  .hero::before{font-size:80px;right:10px}
  .hero-stat{min-width:90px;padding:10px 12px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-icon">🥚</div>
    <div>
      <div class="hdr-title">Ndokk_Mu</div>
      <div class="hdr-sub">Distributor Telur Ter Pecaya</div>
    </div>
  </div>
  <button class="btn-login" onclick="openLogin()">🔐 Login</button>
</header>

<div class="ticker" id="tickerBar">📅 Memuat...</div>

<div class="hero">
  <h1>🥚 Harga Telur Hari Ini</h1>
  <p>Informasi harga dan stok terkini dari admin</p>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="val" id="heroStok">—</div>
      <div class="lbl">Total Stok (pcs)</div>
    </div>
  </div>
  <div id="heroKatGrid" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"></div>
</div>

<footer>
  &copy; 2025 Ndokk_Mu · Sistem Manajemen Distributor Telur
</footer>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeLogin()">✕</button>
    <h3>🔐 Login</h3>
    <p>Masukkan username dan password Anda</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Masuk</button>
    <div class="login-error" id="loginError">Username atau password salah</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase Config (gwatel-7d29a) ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAhFOG2GrE8VFXdsUBILjdCi4TNX6GO5RY",
  authDomain: "gwatel-7d29a.firebaseapp.com",
  projectId: "gwatel-7d29a",
  storageBucket: "gwatel-7d29a.firebasestorage.app",
  messagingSenderId: "1033750054618",
  appId: "1:1033750054618:web:063888931fe4041cae47e3",
  measurementId: "G-038S2QL5CM"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
window._db = db;

// ── TICKER ───────────────────────────────────────────────────────────────────
function updateTicker(){
  const now = new Date();
  const tgl = now.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const jam = now.toLocaleTimeString('id-ID');
  document.getElementById('tickerBar').textContent = `📅 ${tgl}  |  ⏰ ${jam}`;
}
updateTicker(); setInterval(updateTicker, 1000);

const rp = n => n||n===0 ? 'Rp '+Number(n).toLocaleString('id-ID') : '—';
const fmt = n => n||n===0 ? Number(n).toLocaleString('id-ID') : '—';

// ── LOAD STOK ────────────────────────────────────────────────────────────────
async function loadAdminInfo(){
  try{
    // Total stok dari settings admin
    const settingsDoc = await getDoc(doc(db,'settings','admin'));
    if(settingsDoc.exists()){
      const d = settingsDoc.data();
      const stok = d.stok_kg ?? null;
      document.getElementById('heroStok').textContent = stok !== null ? fmt(Math.round(stok))+' pcs' : '—';
    }

    // Stok per kategori: hitung dari transaksi_kulak & transaksi_jual (FIFO per kat)
    const { getDocs: _getDocs, collection: _col, query: _q, orderBy: _ob } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const [kulakSnap, jualSnap] = await Promise.all([
      _getDocs(_q(_col(db,'transaksi_kulak'), _ob('tanggal','asc'))),
      _getDocs(_q(_col(db,'transaksi_jual'),  _ob('tanggal','asc')))
    ]);
    const kulak = kulakSnap.docs.map(d=>({...d.data()}));
    const jual  = jualSnap.docs.map(d=>({...d.data()}));

    // Hitung sisa stok per kategori (FIFO sederhana per kat)
    const kats = [...new Set(kulak.map(k=>k.kategori||'Umum'))];
    const stokPerKat = {};
    for(const kat of kats){
      const batches = kulak.filter(k=>(k.kategori||'Umum')===kat).map(k=>({sisa:Number(k.qty)||0}));
      const sells = jual.filter(j=>(j.kategori||'Umum')===kat).sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||''));
      for(const s of sells){
        let rem=Number(s.qty)||0;
        for(const b of batches){if(rem<=0)break;const u=Math.min(b.sisa,rem);b.sisa-=u;rem-=u;}
      }
      stokPerKat[kat] = batches.reduce((s,b)=>s+b.sisa,0);
    }

    // Render kartu per kategori
    const grid = document.getElementById('heroKatGrid');
    if(kats.length>0){
      grid.innerHTML = kats.map(kat=>`
        <div class="kat-stat">
          <div class="val">${fmt(Math.round(stokPerKat[kat]))} pcs</div>
          <div class="lbl">${kat}</div>
        </div>`).join('');
    }
  }catch(e){ console.error(e) }
}

loadAdminInfo();

// ── LOGIN — Firestore username + password ─────────────────────────────────────
window.openLogin = function(){
  document.getElementById('loginModal').classList.add('active');
  setTimeout(()=>document.getElementById('loginUsername').focus(), 100);
}
window.closeLogin = function(){
  document.getElementById('loginModal').classList.remove('active');
}

window.doLogin = async function(){
  const username = document.getElementById('loginUsername').value.trim();
  const pass     = document.getElementById('loginPassword').value;
  const errEl    = document.getElementById('loginError');
  const btn      = document.getElementById('loginBtn');

  errEl.style.display = 'none';

  if(!username || !pass){
    errEl.textContent = 'Username dan password wajib diisi';
    errEl.style.display = 'block';
    return;
  }

  // Tampilkan loading
  btn.disabled = true;
  btn.textContent = 'Memeriksa...';

  try{
    // Query ke collection 'users' dengan field 'username'
    const q    = query(collection(db,'users'), where('username','==', username));
    const snap = await getDocs(q);

    if(snap.empty){
      errEl.textContent = 'Username tidak ditemukan.';
      errEl.style.display = 'block';
      return;
    }

    // Ambil dokumen pertama yang cocok
    const userDoc  = snap.docs[0];
    const userData = userDoc.data();

    // Cek password
    if(userData.password !== pass){
      errEl.textContent = 'Password salah.';
      errEl.style.display = 'block';
      return;
    }

    // Simpan info user ke sessionStorage agar halaman lain bisa membacanya
    sessionStorage.setItem('loggedUser', JSON.stringify({
      uid      : userDoc.id,
      username : userData.username,
      nama     : userData.nama || '',
      role     : userData.role || ''
    }));

    // Redirect berdasarkan role
    const role = userData.role || '';
    if(role==='admin' || role==='superuser'){
      window.location.href = 'admin.html';
    } else if(role==='agen'){
      window.location.href = 'agen.html';
    } else {
      errEl.textContent = 'Role tidak dikenali.';
      errEl.style.display = 'block';
    }

  }catch(e){
    console.error(e);
    errEl.textContent = 'Terjadi kesalahan. Coba lagi.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}

// Tutup modal klik di luar
document.getElementById('loginModal').addEventListener('click', function(e){
  if(e.target === this) closeLogin();
});
// Enter untuk submit
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.getElementById('loginModal').classList.contains('active')) doLogin();
});
</script>
</body>
</html>
